{{define "content"}}
<h1>Add Problem</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/problems">
  <p><label>Title <input type="text" name="title" required></label></p>
  <p><label>LeetCode URL or slug <input type="text" name="url" required></label></p>
  <p><label>Difficulty
    <select name="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
  </label></p>
  <p><label>Topics (comma-separated) <input type="text" name="topics" size="40"></label></p>
  <p><label>First grade
    <select name="grade">
      <option value="Failed">Failed</option>
      <option value="Hard">Hard</option>
      <option value="Good" selected>Good</option>
      <option value="Easy">Easy</option>
    </select>
  </label></p>
  <button type="submit">Add</button>
</form>
{{end}}
