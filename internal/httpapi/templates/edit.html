{{define "content"}}
<h1>Edit Problem</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/problems/{{.Problem.ID}}/update">
  <p><label>Title <input type="text" name="title" value="{{.Problem.Title}}" required></label></p>
  <p><label>LeetCode URL or slug <input type="text" name="url" class="mono" value="{{.Problem.URL}}" required></label></p>
  <p>Difficulty</p>
  {{template "difficulty-picker" .Problem.Difficulty}}
  <p>Topics</p>
  {{template "topic-picker" .}}
  <button type="submit">Save</button>
</form>
<form method="post" action="/problems/{{.Problem.ID}}/delete" onsubmit="return confirm('Delete this problem? This also removes its attempt history.');">
  <button type="submit" class="btn-danger">Delete</button>
</form>
{{end}}
