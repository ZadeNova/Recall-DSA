{{define "layout"}}
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Recall-DSA</title>
<style>
  /* Placeholder design tokens — FRONTEND.md "Visual identity" is TBD.
     These are deliberately unremarkable defaults; structure (this file
     and templates/partials) reference the tokens, not literal colors, so
     real values can be swapped in one place later without touching any
     page template. See FRONTEND.md's "Deferral strategy". */
  :root {
    --bg: #fff;
    --text: #222;
    --muted-bg: #f5f5f5;
    --muted-text: #666;
    --accent: #0057b3;
    --danger: #b00020;
    --border: #ddd;
  }

  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--text); }
  nav a { margin-right: 1rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  form.grade-form { display: inline; margin-right: 0.3rem; }
  .topic-tag { display: inline-block; background: var(--muted-bg); border-radius: 4px; padding: 0.1rem 0.5rem; margin: 0 0.2rem 0.2rem 0; font-size: 0.85em; }
  .error { color: var(--danger); }
  .muted-section { background: var(--muted-bg); color: var(--muted-text); padding: 0.75rem 1rem; border-radius: 4px; margin-top: 1rem; }
  .muted-section table { margin-top: 0.5rem; }
  .muted-section th, .muted-section td { border-bottom: 1px solid var(--border); color: var(--muted-text); }
</style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/due">Due</a>
  <a href="/library">Library</a>
  <a href="/problems/new">Add Problem</a>
  <a href="/topics">Topics</a>
</nav>
<hr>
{{template "content" .}}
</body>
</html>
{{end}}
