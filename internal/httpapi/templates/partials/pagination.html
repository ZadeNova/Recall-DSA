{{define "pagination"}}
<div class="pagination">
  <span class="meta">{{.ShowingText}}</span>
  <span class="pagination-controls">
    {{if .PrevURL}}<a href="{{.PrevURL}}" class="btn-secondary">&laquo; Prev</a>{{end}}
    <form method="get" class="page-size-form">
      {{range .HiddenFields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">{{end}}
      <select name="{{.PageSizeParam}}" onchange="this.form.submit()">
        <option value="10" {{if eq .PageSize 10}}selected{{end}}>10 rows</option>
        <option value="25" {{if eq .PageSize 25}}selected{{end}}>25 rows</option>
        <option value="50" {{if eq .PageSize 50}}selected{{end}}>50 rows</option>
      </select>
    </form>
    {{if .NextURL}}<a href="{{.NextURL}}" class="btn-secondary">Next &raquo;</a>{{end}}
  </span>
</div>
{{end}}
