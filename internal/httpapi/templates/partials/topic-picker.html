{{define "topic-picker"}}
<div class="topic-picker">
  <div class="topic-picker-header">
    <div>
      <p class="section-title">Topics</p>
      <p class="section-subtitle">Assign DSA algorithm categories and patterns to this problem.</p>
    </div>
    <input type="text" class="topic-filter" placeholder="Filter topics..." oninput="filterTopicChips(this)" onkeydown="if (event.key === 'Enter') event.preventDefault()">
  </div>
  <div class="topic-chips">
    {{range .AllTopics}}
    <label class="topic-chip">
      <input type="checkbox" name="topic" value="{{.}}" {{if index $.Selected .}}checked{{end}}>
      <span>{{.}}</span>
    </label>
    {{end}}
  </div>
  <div class="new-topic-row">
    <label for="new-topics-input">New topic(s) (comma-separated):</label>
    <input type="text" id="new-topics-input" name="new_topics">
  </div>
</div>
<script>
  function filterTopicChips(input) {
    var q = input.value.toLowerCase();
    var chips = input.closest(".topic-picker").querySelectorAll(".topic-chip");
    chips.forEach(function (chip) {
      chip.hidden = q !== "" && chip.textContent.toLowerCase().indexOf(q) === -1;
    });
  }
</script>
{{end}}
